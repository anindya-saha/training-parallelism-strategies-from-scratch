[project]
name = "training-parallelism-strategies-from-scratch"
version = "0.0.1"
description = "5D parallelism experiments"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets>=4.0.0",
    "qwen_vl_utils==0.0.11",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "torchmetrics>=1.0.3",
    "torchvision==0.23.0",
    "torch-optimizer==0.3.0",
    "transformers[torch]==4.57.1",
    "deepspeed>=0.14.0",
    "omegaconf>=2.3.0",
    "rich>=13.0.0",
    "torchtnt",
    "torchdata",
    "jinja2-cli>=0.8.0",
    "tensorboard",
    "torch-tb-profiler"
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
]

notebook = [
    "jupyter>=1.0.0",
    "notebook>=7.0.0",
    "ipykernel>=6.25.0",
    "ipywidgets>=8.0.0",
    "jupyterlab>=4.0.0",
    "nbdistributed==0.1.0",
    "matplotlib>=3.10.7",
    "seaborn>=0.13.2",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
torchaudio = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
torchmetrics = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true


[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
