[project]
name = "pytorch-dlc"
version = "2.11.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3",
    "botocore",
    "deepspeed==0.18.8",
    "fastai",
    "packaging",
    "pyyaml",
    "requests",
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "torchvision==0.26.0",
]

[project.optional-dependencies]
# sagemaker = [
#     "smclarify",
#     "sagemaker>=3.4.0",
