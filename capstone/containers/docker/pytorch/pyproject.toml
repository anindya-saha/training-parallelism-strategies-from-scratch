[project]
name = "pytorch-dlc"
version = "2.11.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.11.0",
    "torchvision==0.26.0",
    "torchaudio==2.11.0",
    "deepspeed==0.18.8",
    "fastai",
    "boto3",
    "botocore",
    "pyyaml",
    "requests",
    "packaging",
]

[project.optional-dependencies]
sagemaker = [
    "smclarify",
    "sagemaker>=3.4.0",
    "sagemaker-pytorch-training",
    "sagemaker-training",
    "mlflow>=3.9.0",
    "bokeh",
    "imageio",
    "numba",
    "pandas",
    "plotly",
    "shap",
    "scikit-learn",
    "seaborn",
    "cloudpickle",
    "s3fs>=2026.2.0",
]

# Vizuara / capstone workshop (installed in Docker runtime-base via: uv sync --extra capstone)
capstone = [
    "datasets>=4.0.0",
    "numpy>=2.0.0",
    "tiktoken>=0.9.0",
    "tqdm>=4.66.0",
    "transformers>=4.45.0",
    "qwen_vl_utils==0.0.11",
    "torchmetrics>=1.0.3",
    "torch-optimizer==0.3.0",
    "torch-tb-profiler",
]

capstone-hyperpod = [
    "hyperpod-elastic-agent",
]

capstone-notebook = [
    "jupyter>=1.0.0",
    "notebook>=7.0.0",
    "ipykernel>=6.25.0",
    "ipywidgets>=8.0.0",
    "jupyterlab>=4.0.0",
    "nbdistributed==0.1.0",
    "matplotlib>=3.10.7",
    "seaborn>=0.13.2",
]

capstone-dev = [
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
]

[tool.uv]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]
torchvision = [{ index = "pytorch-cu130" }]
torchaudio = [{ index = "pytorch-cu130" }]
