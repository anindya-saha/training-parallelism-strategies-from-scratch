apiVersion: sagemaker.amazonaws.com/v1
kind: HyperPodPyTorchJob
metadata:
  name: llama3-1-8b-fsdp-hpto
  namespace: {{ $namespace }}
  annotations:
    description: "Llama 3.1 8B FSDP training using HyperPod Training Operator"
spec:
  nprocPerNode: "8"

  replicaSpecs:
    - name: pods
      replicas: 2  # Multi-node training (2x p4d.24xlarge = 16 GPUs total)
      template:
        metadata:
          labels:
            job-name: llama3-1-8b-fsdp-hpto
            replica-type: pods
            app: llama-fsdp-training
            model: llama3-1-8b
        spec:
          nodeSelector:
            beta.kubernetes.io/instance-type: ml.p4d.24xlarge
          serviceAccountName: {{ $serviceAccount }}
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      job-name: llama3-1-8b-fsdp-hpto
                  topologyKey: kubernetes.io/hostname
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: sagemaker.amazonaws.com/node-health-status
                        operator: In
                        values:
                          - Schedulable
                      - key: sagemaker.amazonaws.com/compute-type
                        operator: In
                        values:
                          - hyperpod
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  job-name: llama3-1-8b-fsdp-hpto
          tolerations:
            - key: "nvidia.com/gpu"
              operator: "Exists"
              effect: "NoSchedule"
          volumes:
            - name: shmem
              hostPath:
                path: /dev/shm
            - name: local
              hostPath:
                path: /mnt/k8s-disks/0
            - name: host-nvme-storage
              hostPath:
                path: /opt/dlami/nvme
                type: Directory
            - name: fsx-storage
              persistentVolumeClaim:
                claimName: fsx-temp-claim
          containers:
            - name: pytorch
              image: {{ $imageUri }}
              imagePullPolicy: IfNotPresent
              resources:
                requests:
                  nvidia.com/gpu: 8
                  vpc.amazonaws.com/efa: 4
                limits:
                  nvidia.com/gpu: 8
                  vpc.amazonaws.com/efa: 4
              env:
                - name: LOGLEVEL
                  value: INFO
                - name: TORCH_DISTRIBUTED_DEBUG
                  value: DETAIL
                - name: TORCH_NCCL_ENABLE_MONITORING
                  value: '1'
                - name: TORCH_NCCL_TRACE_BUFFER_SIZE
                  value: '20000'
                - name: TORCH_NCCL_DUMP_ON_TIMEOUT
                  value: '1'
                - name: TORCH_NCCL_DEBUG_INFO_TEMP_FILE
                  value: /local/nccl_trace_rank_
                - name: PYTORCH_CUDA_ALLOC_CONF
                  value: 'expandable_segments:True'
                - name: NCCL_DEBUG
                  value: INFO
                - name: NCCL_ASYNC_ERROR_HANDLING
                  value: '1'
                - name: NCCL_SOCKET_IFNAME
                  value: ^lo
                - name: TORCH_NCCL_ASYNC_ERROR_HANDLING
                  value: '1'
                # EFA optimizations for P4d with RDMA
                - name: FI_EFA_USE_DEVICE_RDMA
                  value: '1'
                - name: FI_EFA_FORK_SAFE
                  value: '1'
                - name: FI_LOG_LEVEL
                  value: '1'
                - name: FI_PROVIDER
                  value: efa
                - name: FI_EFA_ENABLE_SHM_TRANSFER
                  value: '1'
                - name: FI_EFA_USE_HUGE_PAGE
                  value: '0'
                # Add AWS OFI NCCL library path
                - name: LD_LIBRARY_PATH
                  value: "/opt/amazon/efa/lib:/opt/amazon/openmpi/lib:/opt/amazon/ofi-nccl/lib:/usr/local/lib:$LD_LIBRARY_PATH"
                # Hugging Face
                - name: HF_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: huggingface-token
                      key: token
                - name: HF_HOME
                  value: "/fsx/huggingface_cache"
                - name: HF_HUB_DISABLE_TELEMETRY
                  value: '1'
                # Comet ML
                - name: COMET_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: comet-secrets
                      key: COMET_API_KEY
                - name: COMET_PROJECT_NAME
                  value: "llama-fsdp-hyperpod"
                - name: COMET_WORKSPACE
                  value: "{{ $cometWorkspace }}"
                - name: COMET_HOST
                  value: {{ $serviceAccount }}
                - name: REQUESTS_CA_BUNDLE
                  value: "/etc/ssl/certs/ca-certificates.crt"
              command:
                - hyperpodrun
                - '--tee=3'
                - '--log_dir=/tmp/hyperpod'
                - '--nproc_per_node=8'
                - '--nnodes=2'
                - /fsdp/train.py
                - '--max_context_width=8192'
                - '--num_key_value_heads=8'
                - '--intermediate_size=14336'
                - '--hidden_width=4096'
                - '--num_layers=32'
                - '--num_heads=32'
                - '--model_type=llama_v3'
                - '--tokenizer=hf-internal-testing/llama-tokenizer'
                - '--checkpoint_freq=50'
                - '--validation_freq=25'
                - '--max_steps=1000'
                - '--checkpoint_dir=/fsx/llama_checkpoints'
                - '--dataset=wikitext'
                - '--dataset_config_name=wikitext-2-raw-v1'
                - '--resume_from_checkpoint=/fsx/llama_checkpoints'
                - '--train_batch_size=1'
                - '--val_batch_size=1'
                - '--sharding_strategy=full'
                - '--offload_activations=1'
              volumeMounts:
                - name: shmem
                  mountPath: /dev/shm
                - name: local
                  mountPath: /local
                - name: host-nvme-storage
                  mountPath: /opt/dlami/nvme
                - name: fsx-storage
                  mountPath: /fsx
              securityContext:
                capabilities:
                  add:
                    - IPC_LOCK
                    - SYS_PTRACE
              livenessProbe:
                exec:
                  command:
                    - /bin/bash
                    - -c
                    - "ps aux | grep python || true"
                initialDelaySeconds: 120
                periodSeconds: 60
                timeoutSeconds: 30
                failureThreshold: 10

  runPolicy:
    jobMaxRetryCount: 10
    restartPolicy:
      numRestartBeforeFullJobRestart: 3
      evalPeriodSeconds: 21600
      maxFullJobRestarts: 1
    cleanPodPolicy: All
    logMonitoringConfiguration:
      - name: JobStart
        logPattern: '.*Loss:.*'
        expectedStartCutOffInSeconds: 240
      - name: JobHangingDetection
        logPattern: '.*Loss:.*'
        expectedRecurringFrequencyInSeconds: 600
