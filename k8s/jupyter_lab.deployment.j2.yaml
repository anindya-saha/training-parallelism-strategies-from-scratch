apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ DEPLOYMENT_NAME }}
  namespace: {{ NAMESPACE }}
  labels:
    app: jupyter-lab
    deployment: {{ DEPLOYMENT_NAME }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jupyter-lab
      deployment: {{ DEPLOYMENT_NAME }}
  template:
    metadata:
      labels:
        app: jupyter-lab
        deployment: {{ DEPLOYMENT_NAME }}
    spec:
      nodeSelector:
        node.kubernetes.io/instance-type: {{ INSTANCE_TYPE }}
      restartPolicy: Always
      serviceAccountName: {{ SERVICE_ACCOUNT }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: sagemaker.amazonaws.com/node-health-status
                    operator: In
                    values:
                      - Schedulable
                  - key: sagemaker.amazonaws.com/compute-type
                    operator: In
                    values:
                      - hyperpod
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      volumes:
        - name: shmem
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
        - name: fsx-static
          persistentVolumeClaim:
            claimName: {{ FSX_CLAIM }}
      containers:
        - name: jupyter
          image: {{ IMAGE_URI }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8888
              protocol: TCP
          env:
            - name: NCCL_DEBUG
              value: WARN
            - name: JUPYTER_TOKEN
              value: "{{ JUPYTER_TOKEN }}"
            - name: SHELL
              value: /bin/bash
            - name: HF_HOME
              value: "{{ HF_CACHE_DIR }}"
            - name: HUGGINGFACE_HUB_CACHE
              value: "{{ HF_CACHE_DIR }}"
            - name: HF_HUB_DISABLE_XET
              value: "1"
            - name: HF_TOKEN
              value: "{{ HF_TOKEN }}"
          command:
            - /bin/bash
            - -lc
            - |
              set -euo pipefail
              exec jupyter lab \
                --allow-root \
                --ip=0.0.0.0 \
                --port=8888 \
                --no-browser \
                --ServerApp.root_dir=/workspace/training-parallelism-strategies-from-scratch \
                --ServerApp.allow_origin='*' \
                --IdentityProvider.token="${JUPYTER_TOKEN}"
          resources:
            requests:
              cpu: "{{ CPU_REQUEST }}"
              memory: "{{ MEMORY_REQUEST }}"
            limits:
              cpu: "{{ CPU_LIMIT }}"
              memory: "{{ MEMORY_LIMIT }}"
              nvidia.com/gpu: "{{ GPU_COUNT }}"
          volumeMounts:
            - name: shmem
              mountPath: /dev/shm
            - name: fsx-static
              mountPath: /mnt/fsx
          readinessProbe:
            tcpSocket:
              port: 8888
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8888
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: {{ DEPLOYMENT_NAME }}-svc
  namespace: {{ NAMESPACE }}
  labels:
    app: jupyter-lab
    deployment: {{ DEPLOYMENT_NAME }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8888
      targetPort: 8888
      protocol: TCP
  selector:
    app: jupyter-lab
    deployment: {{ DEPLOYMENT_NAME }}
