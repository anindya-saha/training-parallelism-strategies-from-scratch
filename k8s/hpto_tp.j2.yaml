apiVersion: sagemaker.amazonaws.com/v1
kind: HyperPodPyTorchJob
metadata:
  name: {{ JOB_NAME }}
  namespace: {{ NAMESPACE }}
  annotations:
    description: "From-scratch TP training via HyperPod Training Operator"
spec:
  nprocPerNode: "{{ NPROC_PER_NODE | default('8') }}"

  replicaSpecs:
    - name: pods
      replicas: {{ NUM_NODES | default('1') }}
      template:
        metadata:
          labels:
            job-name: {{ JOB_NAME }}
            replica-type: pods
            app: tp-training
        spec:
          nodeSelector:
            beta.kubernetes.io/instance-type: {{ INSTANCE_TYPE }}
          serviceAccountName: {{ SERVICE_ACCOUNT }}
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      job-name: {{ JOB_NAME }}
                  topologyKey: kubernetes.io/hostname
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: sagemaker.amazonaws.com/node-health-status
                        operator: In
                        values:
                          - Schedulable
                      - key: sagemaker.amazonaws.com/compute-type
                        operator: In
                        values:
                          - hyperpod
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  job-name: {{ JOB_NAME }}
          tolerations:
            - key: "nvidia.com/gpu"
              operator: "Exists"
              effect: "NoSchedule"
          volumes:
            - name: shmem
              emptyDir:
                medium: Memory
            - name: local-nvme
              hostPath:
                path: /mnt/k8s-disks/0
            - name: fsx-static
              persistentVolumeClaim:
                claimName: {{ FSX_CLAIM | default('fsx-static-claim') }}
          containers:
            - name: pytorch
              image: {{ IMAGE_URI }}
              imagePullPolicy: IfNotPresent
              resources:
                requests:
                  nvidia.com/gpu: "{{ GPUS_PER_NODE | default('8') }}"
                  vpc.amazonaws.com/efa: "{{ EFA_PER_NODE | default('4') }}"
                limits:
                  nvidia.com/gpu: "{{ GPUS_PER_NODE | default('8') }}"
                  vpc.amazonaws.com/efa: "{{ EFA_PER_NODE | default('4') }}"
              env:
                - name: LOGLEVEL
                  value: INFO
                - name: NCCL_DEBUG
                  value: INFO
                - name: NCCL_ASYNC_ERROR_HANDLING
                  value: "1"
                - name: NCCL_SOCKET_IFNAME
                  value: ^lo
                - name: TORCH_NCCL_ASYNC_ERROR_HANDLING
                  value: "1"
                - name: TORCH_NCCL_ENABLE_MONITORING
                  value: "1"
                - name: TORCH_NCCL_TRACE_BUFFER_SIZE
                  value: "20000"
                - name: TORCH_NCCL_DUMP_ON_TIMEOUT
                  value: "1"
                - name: TORCH_NCCL_DEBUG_INFO_TEMP_FILE
                  value: /local/nccl_trace_rank_
                - name: PYTORCH_CUDA_ALLOC_CONF
                  value: "expandable_segments:True"
                - name: FI_EFA_USE_DEVICE_RDMA
                  value: "1"
                - name: FI_EFA_FORK_SAFE
                  value: "1"
                - name: FI_LOG_LEVEL
                  value: "1"
                - name: FI_PROVIDER
                  value: efa
                - name: LD_LIBRARY_PATH
                  value: "/opt/amazon/efa/lib:/opt/amazon/openmpi/lib:/opt/amazon/ofi-nccl/lib:/usr/local/lib:$LD_LIBRARY_PATH"
              command:
                - hyperpodrun
                - "--tee=3"
                - "--log_dir=/tmp/hyperpod"
                - "--nproc_per_node={{ NPROC_PER_NODE | default('8') }}"
                - "--nnodes={{ NUM_NODES | default('1') }}"
{%- if TRAIN_SCRIPT is defined %}
                - "{{ TRAIN_SCRIPT }}"
{%- else %}
                - "/workspace/tensor-parallelism/train_tp.py"
{%- endif %}
{%- if USE_LARGE is defined and USE_LARGE %}
                - "--large"
{%- endif %}
{%- if USE_SP is defined and USE_SP %}
                - "--sp"
{%- endif %}
                - "--steps={{ STEPS | default('500') }}"
                - "--lr={{ LR | default('3e-4') }}"
                - "--log-interval={{ LOG_INTERVAL | default('10') }}"
                - "--ckpt-interval={{ CKPT_INTERVAL | default('50') }}"
                - "--ckpt-dir={{ CKPT_DIR | default('/mnt/fsx/checkpoints') }}"
              volumeMounts:
                - name: shmem
                  mountPath: /dev/shm
                - name: local-nvme
                  mountPath: /local
                - name: fsx-static
                  mountPath: /mnt/fsx
              securityContext:
                capabilities:
                  add:
                    - IPC_LOCK
                    - SYS_PTRACE
              livenessProbe:
                exec:
                  command:
                    - /bin/bash
                    - -c
                    - "ps aux | grep python || true"
                initialDelaySeconds: 120
                periodSeconds: 60
                timeoutSeconds: 30
                failureThreshold: 10

  runPolicy:
    jobMaxRetryCount: 3
    restartPolicy:
      numRestartBeforeFullJobRestart: 2
      evalPeriodSeconds: 21600
      maxFullJobRestarts: 1
    cleanPodPolicy: All
    logMonitoringConfiguration:
      - name: JobStart
        logPattern: ".*loss.*"
        expectedStartCutOffInSeconds: 300
      - name: JobHangingDetection
        logPattern: ".*loss.*"
        expectedRecurringFrequencyInSeconds: 600
