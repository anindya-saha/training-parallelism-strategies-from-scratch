apiVersion: sagemaker.amazonaws.com/v1
kind: HyperPodPyTorchJob
metadata:
  name: {{ JOB_NAME }}
  namespace: {{ NAMESPACE }}
spec:
  nprocPerNode: "{{ NPROC_PER_NODE | default('8') }}"

  replicaSpecs:
    - name: pods
      replicas: {{ NUM_NODES | default('1') }}
      spares: 0
      template:
        metadata:
          labels:
            job-name: {{ JOB_NAME }}
            replica-type: pods
            app: tp-experiments
        spec:
          nodeSelector:
            beta.kubernetes.io/instance-type: {{ INSTANCE_TYPE }}
          serviceAccountName: {{ SERVICE_ACCOUNT }}
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      job-name: {{ JOB_NAME }}
                  topologyKey: kubernetes.io/hostname
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: sagemaker.amazonaws.com/node-health-status
                        operator: In
                        values:
                          - Schedulable
                      - key: sagemaker.amazonaws.com/compute-type
                        operator: In
                        values:
                          - hyperpod
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  job-name: {{ JOB_NAME }}
          tolerations:
            - key: "nvidia.com/gpu"
              operator: "Exists"
              effect: "NoSchedule"
          volumes:
            - name: shmem
              emptyDir:
                medium: Memory
            - name: local-nvme
              hostPath:
                path: /mnt/k8s-disks/0
            - name: fsx-static
              persistentVolumeClaim:
                claimName: {{ FSX_CLAIM | default('fsx-static-claim') }}
            - name: host-nvme-storage
              hostPath:
                path: /opt/dlami/nvme
                type: Directory
          containers:
            - name: pytorch
              image: {{ IMAGE_URI }}
              imagePullPolicy: IfNotPresent
              resources:
                requests:
                  nvidia.com/gpu: "{{ GPUS_PER_NODE | default('8') }}"
                  vpc.amazonaws.com/efa: "{{ EFA_PER_NODE | default('16') }}"
                limits:
                  nvidia.com/gpu: "{{ GPUS_PER_NODE | default('8') }}"
                  vpc.amazonaws.com/efa: "{{ EFA_PER_NODE | default('16') }}"
              env:
                - name: LOGLEVEL
                  value: INFO
                - name: NCCL_DEBUG
                  value: INFO
                - name: NCCL_ASYNC_ERROR_HANDLING
                  value: "1"
                - name: NCCL_SOCKET_IFNAME
                  value: ^lo
                - name: GLOO_SOCKET_IFNAME
                  value: eth0
                - name: TORCH_NCCL_ASYNC_ERROR_HANDLING
                  value: "1"
                - name: TORCH_NCCL_ENABLE_MONITORING
                  value: "1"
                - name: TORCH_NCCL_TRACE_BUFFER_SIZE
                  value: "20000"
                - name: TORCH_NCCL_DUMP_ON_TIMEOUT
                  value: "1"
                - name: TORCH_NCCL_DEBUG_INFO_TEMP_FILE
                  value: /tmp/nccl_trace_rank_
                - name: PYTORCH_CUDA_ALLOC_CONF
                  value: "expandable_segments:True"
                - name: PYTHONFAULTHANDLER
                  value: "1"
                - name: FI_EFA_USE_DEVICE_RDMA
                  value: "1"
                - name: FI_EFA_FORK_SAFE
                  value: "1"
                - name: FI_LOG_LEVEL
                  value: "1"
                - name: FI_PROVIDER
                  value: efa
                - name: LD_LIBRARY_PATH
                  value: "/opt/amazon/efa/lib:/opt/amazon/openmpi/lib:/opt/amazon/ofi-nccl/lib:/usr/local/lib:$LD_LIBRARY_PATH"
              command:
                - hyperpodrun
                - "--tee=3"
                - "--log_dir=/tmp/hyperpod"
                - "--nproc_per_node={{ NPROC_PER_NODE | default('8') }}"
                - "--nnodes={{ NUM_NODES | default('1') }}"
                - "--server-log-level=warning"
                - "{{ TRAIN_SCRIPT }}"
              volumeMounts:
                - name: shmem
                  mountPath: /dev/shm
                - name: local-nvme
                  mountPath: /tmp
                - name: fsx-static
                  mountPath: /mnt/fsx
                - name: host-nvme-storage
                  mountPath: /opt/dlami/nvme
              securityContext:
                capabilities:
                  add:
                    - IPC_LOCK
                    - SYS_PTRACE
              livenessProbe:
                exec:
                  command:
                    - /bin/bash
                    - -c
                    - "ps aux | grep python || true"
                initialDelaySeconds: 120
                periodSeconds: 60
                timeoutSeconds: 30
                failureThreshold: 10

  runPolicy:
    cleanPodPolicy: All
    jobMaxRetryCount: 0
    ttlSecondsAfterFinished: 0
