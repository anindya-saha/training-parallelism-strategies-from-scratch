apiVersion: sagemaker.amazonaws.com/v1
kind: HyperPodPyTorchJob
metadata:
  name: {{ $jobName }}
  namespace: {{ $namespace }}
spec:
  nprocPerNode: "8"
  replicaSpecs:
  - name: pods
    replicas: 1
    spares: 0
    template:
      metadata:
        labels:
          job-name: {{ $jobName }}
          replica-type: pods
      spec:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: sagemaker.amazonaws.com/node-health-status
                  operator: In
                  values:
                  - Schedulable
                - key: sagemaker.amazonaws.com/compute-type
                  operator: In
                  values:
                  - hyperpod
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  job-name: {{ $jobName }}
              topologyKey: kubernetes.io/hostname
        containers:
        - command:
          - /bin/bash
          - -c
          - |
            # MosaicML Streaming uses POSIX shared memory in /dev/shm (e.g. "000003_locals").
            # If prior runs crashed, stale objects can linger and cause FileExistsError on startup.
            rm -f /dev/shm/*_locals /dev/shm/*_remote
            cd ${project-dir} && hyperpodrun --no-python --tee=3 --log_dir=/tmp/hyperpod --nproc_per_node=8 --nnodes=1 --server-log-level=warning uv run python ${project-dir}/src/train.py --job.config_file configs/qwen3vl_2b_waypoints.py --job.dump_folder /mnt/fsx/users/${USER}/runs/${RUN_ID}
          env:
          - name: COMET_API_KEY
            value: {{ $cometApiKey }}
          - name: COMET_HOST
            value: {{ $cometHost }}
          - name: COMET_PROJECT_NAME
            value: {{ $cometProjectName }}
          - name: COMET_WORKSPACE
            value: {{ $cometWorkspace }}
          - name: COMET_EXPERIMENT_NAME
            value: {{ $cometExperimentName }}
          - name: REQUESTS_CA_BUNDLE
            value: /etc/ssl/certs/ca-certificates.crt
          - name: LOGLEVEL
            value: INFO
          - name: TORCH_DISTRIBUTED_DEBUG
            value: DETAIL
          - name: TORCH_NCCL_ENABLE_MONITORING
            value: "1"
          - name: TORCH_NCCL_TRACE_BUFFER_SIZE
            value: "20000"
          - name: TORCH_NCCL_DUMP_ON_TIMEOUT
            value: "1"
          - name: TORCH_NCCL_DEBUG_INFO_TEMP_FILE
            value: /local/nccl_trace_rank_
          - name: PYTORCH_CUDA_ALLOC_CONF
            value: expandable_segments:True
          - name: NCCL_DEBUG
            value: INFO
          - name: NCCL_ASYNC_ERROR_HANDLING
            value: "1"
          - name: NCCL_SOCKET_IFNAME
            value: ^lo
          - name: GLOO_SOCKET_IFNAME
            value: eth0
          - name: TORCH_NCCL_ASYNC_ERROR_HANDLING
            value: "1"
          - name: LD_LIBRARY_PATH
            value: /opt/amazon/efa/lib:/opt/amazon/openmpi/lib:/opt/amazon/ofi-nccl/lib:/usr/local/lib:$LD_LIBRARY_PATH
          - name: RUN_ID
            valueFrom:
              fieldRef:
                fieldPath: metadata.uid
          - name: PYTHONFAULTHANDLER
            value: "1"
          - name: CUDA_LAUNCH_BLOCKING
            value: "0"
          - name: UV_CACHE_DIR
            value: /opt/dlami/nvme/cache/.uv
          - name: MOSAICML_DOWNLOAD_RETRY
            value: "5"
          - name: USER
            value: {{ $USER }}
          - name: HF_TOKEN
            value: {{ $hfToken }}
          - name: HF_HOME
            value: /mnt/fsx/users/${USER}/huggingface_cache
          - name: HF_HUB_DISABLE_TELEMETRY
            value: "1"
          - name: TOKENIZER_PATH
            value: /mnt/fsx/users/${USER}/Qwen/Qwen2_VL_2B_Instruct
          - name: PRETRAINED_CHECKPOINT_PATH
            value: /mnt/fsx/users/${USER}/Qwen/Qwen2-VL-2B-Instruct/dcp
          - name: LOCAL_BATCH_SIZE
            value: "4"
          - name: GLOBAL_BATCH_SIZE
            value: "1024"
          image: {{ $imageUri }}
          imagePullPolicy: IfNotPresent
          livenessProbe:
            exec:
              command:
              - /bin/bash
              - -c
              - ps aux | grep python || true
            failureThreshold: 10
            initialDelaySeconds: 120
            periodSeconds: 60
            timeoutSeconds: 30
          name: pytorch
          ports:
          - containerPort: 6006
            name: tensorboard
            protocol: TCP
          resources:
            limits:
              nvidia.com/gpu: "8"
              vpc.amazonaws.com/efa: "8"
            requests:
              nvidia.com/gpu: "8"
              vpc.amazonaws.com/efa: "8"
          securityContext:
            capabilities:
              add:
              - IPC_LOCK
              - SYS_PTRACE
          volumeMounts:
          - mountPath: /dev/shm
            name: shmem
          - mountPath: /tmp
            name: local-nvme
          - mountPath: /mnt/fsx-static
            name: fsx-static
          - mountPath: /opt/dlami/nvme
            name: host-nvme-storage
        nodeSelector:
          beta.kubernetes.io/instance-type: ml.p6-b200.48xlarge
        serviceAccountName: {{ $serviceAccount }}
        tolerations:
        - effect: NoSchedule
          key: nvidia.com/gpu
          operator: Exists
        topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              job-name: {{ $jobName }}
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
        volumes:
        - emptyDir:
            medium: Memory
          name: shmem
        - hostPath:
            path: /mnt/k8s-disks/0
          name: local-nvme
        - name: fsx-static
          persistentVolumeClaim:
            claimName: fsx-static-claim
        - hostPath:
            path: /opt/dlami/nvme
            type: Directory
          name: host-nvme-storage
  runPolicy:
    cleanPodPolicy: All
    jobMaxRetryCount: 0
    ttlSecondsAfterFinished: 0
